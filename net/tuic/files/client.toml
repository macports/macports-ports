# TUIC client configuration
#
# This example includes every option supported by TUIC 1.8.10. Replace the
# server, UUID, and password before use. Optional features remain commented.

log_level = "info"

# Runtime: auto, multi_thread, or current_thread.
tokio_runtime = "auto"

[relay]
server = "example.com:443"
uuid = "00000000-0000-0000-0000-000000000000"
password = "CHANGE_ME"

# Optional source IP for the outbound connection.
# ip = "192.0.2.10"

# v4first, v6first, v4only, or v6only.
ipstack_prefer = "v4first"

# Additional PEM certificates used to verify the server.
certificates = []

udp_relay_mode = "native" # native or quic
congestion_control = "bbr" # cubic, new_reno, bbr, or bbr3
alpn = []
zero_rtt_handshake = false
disable_sni = false
# sni = "tuic.example.com"
timeout = "8s"

# eager connects at startup, lazy on first request, and loop retries forever.
startup_mode = "lazy"
heartbeat = "3s"
disable_native_certs = false
send_window = 16777216
receive_window = 8388608
initial_mtu = 1200
min_mtu = 1200
gso = true
pmtu = true
gc_interval = "3s"
gc_lifetime = "15s"
max_concurrent_streams = 1280

# Never enable this in production.
skip_cert_verify = false

[local]
# Local SOCKS5 listener. This may be omitted when only forwarding rules are
# used.
server = "127.0.0.1:1080"
# username = "socks_user"
# password = "socks_password"
dual_stack = true
max_packet_size = 1500
socks5_udp_idle_timeout = "5m"

# Optional upstream SOCKS5 proxy for reaching the TUIC server.
# [relay.proxy]
# server = "127.0.0.1:1081"
# username = "proxy_user"
# password = "proxy_password"
# udp_buffer_size = 2048

# Optional TCP forwarding rules.
# [[local.tcp_forward]]
# listen = "127.0.0.1:8080"
# remote = "example.com:80"

# Optional UDP forwarding rules.
# [[local.udp_forward]]
# listen = "127.0.0.1:5353"
# remote = "8.8.8.8:53"
# timeout = "1m"
