# TUIC server configuration
#
# This example includes every non-deprecated option supported by TUIC 1.8.10.
# Replace the UUID and password before exposing the service to a network. The
# supplied configuration listens only on localhost.

# Logging level: trace, debug, info, warn, error, or off.
log_level = "info"

# UDP listen address.
server = "127.0.0.1:8443"

# Relative certificate/key paths and ACME state are resolved below this path.
data_dir = "@PREFIX@/var/lib/tuic"

udp_relay_ipv6 = true
zero_rtt_handshake = false

# Runtime: auto, multi_thread, or current_thread.
tokio_runtime = "auto"
dual_stack = true
auth_timeout = "3s"
task_negotiation_timeout = "3s"
gc_interval = "10s"
gc_lifetime = "30s"
max_external_packet_size = 1500
stream_timeout = "1m"

# ACL rules are evaluated in order. With an empty list, normal outbound
# selection applies. See the commented examples near the end of this file.
acl = []

[users]
# UUID = password
"00000000-0000-0000-0000-000000000000" = "CHANGE_ME"

[tls]
# Generate a temporary self-signed certificate. For production, set this to
# false and configure certificate/private_key or auto_ssl.
self_sign = true
certificate = ""
private_key = ""
alpn = []
hostname = "localhost"
auto_ssl = false
acme_email = ""

[log]
format = "text" # text or json
compact = true
# log_file = "@PREFIX@/var/log/tuic-server.log"
log_rotation = "never" # never, hourly, or daily

[quic]
initial_mtu = 1200
min_mtu = 1200
gso = true
pmtu = true
send_window = 16777216
receive_window = 8388608
max_idle_time = "30s"
max_concurrent_streams = 1280

[quic.congestion_control]
# cubic, newreno, bbr, or bbr3.
controller = "bbr"
initial_window = 1048576

[outbound.default]
type = "direct"
# v4first, v6first, v4only, or v6only.
ip_mode = "v4first"
bind_ipv4 = []
bind_ipv6 = []
# bind_device = "en0"

[experimental]
# Reject destinations in loopback and private networks by default.
drop_loopback = true
drop_private = true

# Optional HTTP/3 camouflage. Uncomment the complete section to enable it.
# [camouflage]
# enabled = true
# reverse_proxy_url = "https://127.0.0.1:443"
# reverse_proxy_hostname = "example.com"
# request_timeout = "10s"
# skip_backend_tls_verify = false

# Optional local REST API. Keep it on loopback and replace the secret.
# [restful]
# addr = "127.0.0.1:8443"
# secret = "CHANGE_ME"
# maximum_clients_per_user = 0

# Optional named direct outbound. ACL rules can select it by name.
# [outbound.prefer_v6]
# type = "direct"
# ip_mode = "v6first"
# bind_ipv4 = ["0.0.0.0"]
# bind_ipv6 = ["::"]
# bind_device = "en0"

# Optional SOCKS5 outbound. UDP is dropped unless allow_udp is true; TUIC does
# not send UDP through SOCKS5, so allowing it uses a direct path.
# [outbound.through_socks5]
# type = "socks5"
# addr = "127.0.0.1:1080"
# username = "username"
# password = "password"
# allow_udp = false

# ACL examples. Remove `acl = []` above before uncommenting these array tables.
# Addresses may be IPs, CIDRs, domains, wildcards, localhost, or private.
# Ports may include protocol and ranges, such as "udp/53,tcp/80-443".
# [[acl]]
# addr = "private"
# outbound = "drop"
#
# [[acl]]
# addr = "example.com"
# ports = "tcp/443,udp/443"
# outbound = "prefer_v6"
# hijack = "203.0.113.10"
