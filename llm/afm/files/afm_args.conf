# One command or flag per non-comment line. Put a flag and its value on the
# same line; the rest of that line is passed as one value, including spaces.
# Quotes around a whole value are optional; quotes inside it are kept.
# Default service: Apple Foundation Models on 127.0.0.1:9999.

# Common server options:
#--hostname 127.0.0.1
--port 9999
#--webui
#--gateway
#--verbose
#--prewarm n
#--rate-limit-requests 600
#--instructions "You are a helpful assistant"

# To serve an MLX model, replace the active 'serve' line with 'mlx' and
# uncomment a model. Other MLX options can then be enabled as needed.
#mlx
#--model mlx-community/Qwen3-0.6B-4bit
#--enable-prefix-caching
#--kv-bits 8
#--concurrent 4
