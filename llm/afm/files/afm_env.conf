# Sourced by afm-wrapper.sh; use shell assignment syntax (no spaces around =).
# Service must run as a user with Apple Intelligence enabled.
# The wrapper switches to this user's launchd context and runs the service as
# that user. Set a username, or a numeric UID prefixed with #. 501 is usually
# (but not guaranteed) the primary user's UID.
AFM_USER="#501"

# MLX model and Hugging Face cache locations (use absolute writable paths).
#MACAFM_MLX_MODEL_CACHE="/Users/your-user/.cache/afm/models"
#HF_HOME="/Users/your-user/.cache/huggingface"
#HF_HUB_CACHE="/Users/your-user/.cache/huggingface/hub"

# AFM diagnostics (1 enables each setting).
#AFM_DEBUG=1
#AFM_PERF=1

# Override only if the bundled Metal library cannot be found automatically.
#MACAFM_MLX_METALLIB="/opt/local/libexec/afm/AFMKit_AFMKitMLX.bundle/Contents/Resources/default.metallib"

# Optional image model used by /v1/images/generations.
#MACAFM_IMAGE_MODEL="owner/model"
